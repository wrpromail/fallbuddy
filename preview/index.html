<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>摔友记 V0 · 开发预览</title>
<style>:root {
  --bg: #f2f6ff;
  --ink: #2b2340;
  --sub: #6b6784;
  --muted: #9a96ae;
  --primary: #2f6fe0;
  --primary-2: #4c8dff;
  --accent: #ff8a3d;
  --mint: #2fb98f;
  --line: #eef1f8;
  --card: #ffffff;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  height: 100%;
  background: #dfe6f5;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  color: var(--ink);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}

body.full-mode {
  align-items: flex-start;
}

body.full-mode .phone {
  height: auto;
  min-height: 864px;
}

body.full-mode .phone__screen {
  height: auto;
}

body.full-mode #app {
  flex: none;
}

body.full-mode .scroll {
  overflow: visible;
  padding-bottom: 30px;
}

body.full-mode .fab {
  position: static;
  margin: 16px 16px 12px auto;
}

body.full-mode .form-footer {
  position: static;
  margin-top: 10px;
}

.workspace {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #ffffff;
  border-radius: 999px;
  padding: 8px 10px;
  box-shadow: 0 10px 30px rgba(43, 35, 64, 0.1);
}

.toolbar button {
  border: none;
  background: transparent;
  font: inherit;
  font-size: 13px;
  color: var(--sub);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
}

.toolbar button.on {
  background: rgba(76, 141, 255, 0.12);
  color: var(--primary);
  font-weight: 700;
}

.toolbar .tag {
  font-size: 11px;
  color: var(--muted);
  border-left: 1px solid var(--line);
  padding-left: 10px;
  margin-left: 4px;
}

.phone {
  position: relative;
  width: 390px;
  height: 844px;
  border-radius: 46px;
  background: #0f1020;
  padding: 10px;
  box-shadow: 0 40px 90px rgba(21, 24, 51, 0.34);
  flex: none;
}

.phone__screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 36px;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

.statusbar {
  height: 46px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 22px 6px;
  font-size: 13px;
  font-weight: 700;
  flex: none;
  color: var(--ink);
}

.statusbar__icons {
  display: flex;
  align-items: center;
  gap: 5px;
}

.statusbar__icons span {
  display: inline-block;
  width: 16px;
  height: 10px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  position: relative;
}

.statusbar__icons span::after {
  content: '';
  position: absolute;
  inset: 1.5px;
  background: currentColor;
  border-radius: 1px;
}

#app {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.hidden {
  display: none !important;
}

.screen {
  position: relative;
  flex: 1;
  min-height: 0;
  display: none;
  flex-direction: column;
}

.screen.on {
  display: flex;
}

.navbar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.2px;
  flex: none;
  position: relative;
}

.navbar__back {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  color: var(--ink);
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px 8px;
}

.scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 14px 96px;
  scrollbar-width: none;
}

.scroll::-webkit-scrollbar {
  display: none;
}

.card {
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 8px 26px rgba(43, 35, 64, 0.06);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 11px;
  background: #f1f4fd;
  color: #5b5875;
  white-space: nowrap;
}

.pill--blue {
  background: rgba(76, 141, 255, 0.12);
  color: var(--primary);
}

.pill--accent {
  background: rgba(255, 138, 61, 0.12);
  color: #c85f14;
}

.pill--mint {
  background: rgba(47, 185, 143, 0.12);
  color: #1f8f6b;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 38px;
  padding: 0 16px;
  border-radius: 999px;
  border: none;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  background: #eef2ff;
  color: var(--primary);
  cursor: pointer;
}

.btn--primary {
  background: linear-gradient(135deg, #4c8dff, #2f6fe0);
  color: #fff;
  box-shadow: 0 8px 18px rgba(47, 111, 224, 0.28);
}

.btn--ghost {
  background: rgba(255, 255, 255, 0.75);
  color: var(--ink);
  border: 1px solid #e4e9f6;
}

.btn:disabled {
  opacity: 0.45;
  box-shadow: none;
  cursor: default;
}

.btn--block {
  width: 100%;
  height: 46px;
  font-size: 15px;
}

.muted {
  color: var(--sub);
}

.tiny {
  font-size: 10px;
  color: var(--muted);
}

.section-title {
  font-size: 14px;
  font-weight: 800;
}

.between {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ---------------- atlas ---------------- */

.hero {
  padding: 4px 2px 0;
}

.hero__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.hero__name {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -0.4px;
  line-height: 1.2;
  cursor: pointer;
}

.hero__meta {
  margin-top: 3px;
  font-size: 11px;
  color: var(--sub);
}

.hero__actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 6px 14px rgba(43, 35, 64, 0.08);
  font-size: 13px;
  color: #4a4466;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stats {
  display: flex;
  gap: 7px;
  margin-top: 12px;
}

.stat {
  flex: 1;
  background: rgba(255, 255, 255, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 12px;
  padding: 8px 10px;
}

.stat--wide {
  flex: 1.4;
}

.stat__num {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.2;
}

.stat__label {
  font-size: 10px;
  color: var(--muted);
}

.stat__value {
  font-size: 14px;
  font-weight: 800;
  color: var(--primary);
  margin-top: 1px;
}

.stage {
  margin-top: 12px;
  padding: 10px 10px 8px;
  overflow: hidden;
}

.seg {
  display: flex;
  background: #f1f4fd;
  border-radius: 999px;
  padding: 2px;
}

.seg button {
  border: none;
  background: transparent;
  font: inherit;
  font-size: 11px;
  color: var(--sub);
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
}

.seg button.on {
  background: #fff;
  color: var(--ink);
  font-weight: 700;
  box-shadow: 0 3px 8px rgba(43, 35, 64, 0.1);
}

.stage__canvas {
  position: relative;
  margin-top: 6px;
  border-radius: 14px;
  background:
    radial-gradient(80% 60% at 50% 30%, #ffffff 0%, rgba(255, 255, 255, 0) 70%),
    linear-gradient(180deg, #eef5ff 0%, #e3edff 72%, #dce9ff 100%);
  overflow: hidden;
  display: flex;
  justify-content: center;
}

.figure {
  position: relative;
  width: 210px;
  height: 315px;
  flex: none;
}

.rig {
  position: relative;
  z-index: 0;
  width: 100%;
  height: 100%;
}

.rig--spin {
  animation: rig-spin 900ms cubic-bezier(0.42, 0, 0.28, 1);
}

.rig--hug {
  animation: rig-hug 1400ms cubic-bezier(0.42, 0, 0.28, 1);
}

.rig--cheer {
  animation: rig-cheer 900ms ease-out;
}

.rig--gift {
  animation: rig-gift 1300ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.rig-layer {
  position: absolute;
  display: block;
}

.rig-layer svg {
  display: block;
  width: 100%;
  height: 100%;
}

.hotspot {
  position: absolute;
  width: 36px;
  height: 36px;
  margin-left: -18px;
  margin-top: -18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 8;
}

.hotspot .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1px dashed rgba(43, 35, 64, 0.3);
  background: rgba(255, 255, 255, 0.55);
}

.stack {
  display: flex;
  align-items: center;
  justify-content: center;
}

.stack .avatar-chip + .avatar-chip {
  margin-left: -4px;
}

.avatar-chip {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 2px 6px rgba(43, 35, 64, 0.16);
  flex: none;
}

.avatar-chip.more {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2b2340;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
}

.stage__hint {
  margin-top: 6px;
  text-align: center;
  font-size: 11px;
  color: #6b6784;
}

.fab {
  position: absolute;
  right: 16px;
  bottom: 76px;
  height: 46px;
  padding: 0 18px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, #4c8dff, #2f6fe0);
  color: #fff;
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 5px;
  box-shadow: 0 12px 26px rgba(47, 111, 224, 0.34);
  z-index: 20;
  cursor: pointer;
}

.topicline {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #eef1f8;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 10px;
  color: var(--muted);
}

.topicline__note {
  color: #b0adc2;
}

.hotlist {
  margin-top: 12px;
  padding: 13px 14px;
}

.hotpills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.hotpill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(76, 141, 255, 0.08);
  font-size: 10px;
  color: var(--primary);
  font-weight: 600;
}

.bars {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bar {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bar__label {
  width: 58px;
  font-size: 11px;
  color: #4a4466;
}

.bar__track {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: #eef1f8;
  overflow: hidden;
}

.bar__fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #7fb0ff, #2f6fe0);
}

.bar__num {
  width: 18px;
  text-align: right;
  font-size: 11px;
  font-weight: 800;
  color: var(--primary);
}

.recent {
  margin-top: 16px;
}

.recent__list,
.stories__list {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.story-card {
  background: #fff;
  border-radius: 14px;
  padding: 12px 13px;
  box-shadow: 0 6px 18px rgba(43, 35, 64, 0.05);
  cursor: pointer;
}

.story-card:active {
  transform: scale(0.99);
}

.story-card__head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.story-card__avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #f1f4fd;
  overflow: hidden;
  flex: none;
}

.story-card__name {
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 5px;
}

.story-card__badge {
  font-size: 9px;
  color: var(--primary);
  background: rgba(76, 141, 255, 0.12);
  border-radius: 999px;
  padding: 0 6px;
  font-weight: 500;
}

.story-card__meta {
  font-size: 10px;
  color: var(--muted);
}

.story-card__title {
  margin-top: 8px;
  font-size: 15px;
  font-weight: 800;
  line-height: 1.4;
}

.story-card__tags {
  margin-top: 7px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tag {
  font-size: 10px;
  color: var(--sub);
  background: #f3f5fb;
  border-radius: 999px;
  padding: 2px 8px;
}

.tag--blue {
  color: var(--primary);
  background: rgba(76, 141, 255, 0.12);
}

.tag--warm {
  color: #c85f14;
  background: rgba(255, 138, 61, 0.12);
}

.tag--mint {
  color: #1f8f6b;
  background: rgba(47, 185, 143, 0.12);
}

.footnote {
  margin: 18px 6px 0;
  font-size: 10px;
  line-height: 1.6;
  color: var(--muted);
  text-align: center;
}

/* ---------------- tabbar ---------------- */

.tabbar {
  height: 62px;
  flex: none;
  background: rgba(255, 255, 255, 0.96);
  display: flex;
  border-top: 1px solid #f0f2f8;
  z-index: 30;
}

.tabbar button {
  flex: 1;
  padding-bottom: 4px;
  border: none;
  background: none;
  font: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  color: #98a2b8;
  cursor: pointer;
}

.tabbar button.on {
  color: var(--primary);
  font-weight: 700;
}

.tabbar .icon {
  width: 24px;
  height: 24px;
}

.tabbar .icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.tabbar .icon .active {
  display: none;
}

.tabbar button.on .icon .active {
  display: block;
}

.tabbar button.on .icon .normal {
  display: none;
}

/* ---------------- story ---------------- */

.author {
  display: flex;
  align-items: center;
  gap: 8px;
}

.author__avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #f1f4fd;
  overflow: hidden;
  flex: none;
}

.author__name {
  font-size: 13px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 5px;
}

.author__meta {
  font-size: 10px;
  color: var(--muted);
}

.story-stage {
  position: relative;
  margin-top: 10px;
  height: 294px;
  border-radius: 18px;
  overflow: hidden;
  background:
    radial-gradient(70% 55% at 50% 32%, #ffffff 0%, rgba(255, 255, 255, 0) 68%),
    linear-gradient(180deg, #edf4ff 0%, #dfeaff 100%);
}

.story-stage__badge {
  position: absolute;
  left: 12px;
  top: 12px;
  font-size: 10px;
  padding: 4px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.85);
  color: #4a4466;
  z-index: 4;
}

.story-stage__impact {
  position: absolute;
  right: 12px;
  top: 12px;
  font-size: 10px;
  padding: 4px 9px;
  border-radius: 999px;
  background: rgba(255, 138, 61, 0.16);
  color: #c85f14;
  font-weight: 800;
  z-index: 4;
}

.story-stage__rig {
  position: absolute;
  left: 50%;
  bottom: -14px;
  width: 196px;
  height: 294px;
  transform: translateX(-50%);
}

.story-stage__me {
  position: absolute;
  left: -6px;
  bottom: -28px;
  width: 150px;
  height: 225px;
  opacity: 0;
  z-index: 3;
}

.story-stage.hug .story-stage__me {
  animation: me-in 1400ms cubic-bezier(0.32, 0.72, 0.22, 1) both;
}

.story-stage.hug .story-stage__rig {
  animation: author-shift 1400ms cubic-bezier(0.32, 0.72, 0.22, 1) both;
}

.fx {
  position: absolute;
  left: 50%;
  top: 26%;
  transform: translateX(-50%);
  font-size: 46px;
  z-index: 6;
  animation: fx-float 1600ms ease-out both;
}

.story-body {
  margin-top: 10px;
  padding: 15px 14px;
}

.story-body__title {
  font-size: 22px;
  font-weight: 800;
  line-height: 1.32;
  letter-spacing: -0.3px;
}

.story-body__text {
  margin-top: 8px;
  font-size: 14px;
  line-height: 1.72;
  color: #3b3554;
  white-space: pre-wrap;
}

.story-body__note {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed #e8ecf7;
  font-size: 10px;
  line-height: 1.6;
  color: var(--muted);
}

.timeline {
  margin-top: 10px;
  padding: 14px;
}

.update {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.update__rail {
  width: 8px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 5px;
}

.update__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--primary-2);
  box-shadow: 0 0 0 3px rgba(76, 141, 255, 0.14);
}

.update__type {
  font-size: 11px;
  font-weight: 800;
  color: var(--primary);
}

.update__time {
  font-size: 10px;
  color: var(--muted);
}

.update__text {
  margin-top: 3px;
  font-size: 13px;
  line-height: 1.65;
}

.reactions {
  margin-top: 10px;
  padding: 12px;
}

.reactions__grid {
  display: flex;
  gap: 6px;
}

.reaction {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 3px 6px;
  border-radius: 11px;
  border: 1px solid #edf1fa;
  background: #f7f9ff;
  font: inherit;
  font-size: 10px;
  color: var(--sub);
  cursor: pointer;
}

.reaction:disabled {
  opacity: 0.42;
  cursor: default;
}

.reaction--gift {
  background: rgba(47, 185, 143, 0.1);
  border-color: rgba(47, 185, 143, 0.24);
}

.reaction__emoji {
  font-size: 20px;
  line-height: 1.1;
}

.reaction__count {
  position: absolute;
  top: 3px;
  right: 5px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  border-radius: 999px;
  background: rgba(43, 35, 64, 0.72);
  color: #fff;
  font-size: 9px;
  line-height: 14px;
  text-align: center;
}

.reactions__note {
  margin-top: 8px;
  text-align: center;
  font-size: 9px;
  color: var(--muted);
}

.links {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 16px;
}

.link {
  font-size: 11px;
  color: var(--muted);
  text-decoration: underline;
  cursor: pointer;
}

/* ---------------- avatar ---------------- */

.avatar-stage {
  position: relative;
  margin-top: 4px;
  height: 330px;
  border-radius: 18px;
  overflow: hidden;
  background:
    radial-gradient(70% 55% at 50% 30%, #ffffff 0%, rgba(255, 255, 255, 0) 70%),
    linear-gradient(180deg, #eef5ff 0%, #dfeaff 100%);
}

.avatar-stage__rig {
  position: absolute;
  left: 50%;
  bottom: -14px;
  width: 210px;
  height: 315px;
  transform: translateX(-50%);
}

.panel {
  margin-top: 10px;
  padding: 14px;
}

.panel__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 9px;
}

.expressions {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

.expression {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 2px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: #f6f8fd;
  font: inherit;
  font-size: 9px;
  color: var(--sub);
  cursor: pointer;
}

.expression.on {
  background: rgba(76, 141, 255, 0.1);
  border-color: var(--primary-2);
  color: var(--primary);
}

.expression__emoji {
  font-size: 19px;
}

.palettes {
  display: flex;
  gap: 9px;
}

.swatch {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 4px 10px rgba(43, 35, 64, 0.16);
  cursor: pointer;
}

.swatch.on {
  box-shadow: 0 0 0 2px #2b2340, 0 6px 14px rgba(43, 35, 64, 0.2);
}

.gear-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.gear {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 11px;
  border-radius: 9px;
  background: #f7f9ff;
  border: 1px solid transparent;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.gear.on {
  border-color: var(--primary-2);
  background: rgba(76, 141, 255, 0.06);
  font-weight: 700;
}

.gear__check {
  font-size: 10px;
  color: var(--primary);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  min-height: 30px;
  padding: 5px 11px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: #f5f7fc;
  font: inherit;
  font-size: 12px;
  color: #4a4466;
  cursor: pointer;
}

.chip.on {
  background: rgba(76, 141, 255, 0.1);
  border-color: var(--primary-2);
  color: var(--primary);
  font-weight: 700;
}

.chip--grid {
  flex: 1 1 calc(33.33% - 6px);
  text-align: center;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0 0;
  margin-top: 9px;
  border-top: 1px solid #f0f3fa;
}

.toggle-row__name {
  font-size: 13px;
  font-weight: 600;
}

.switch {
  position: relative;
  width: 42px;
  height: 24px;
  border-radius: 999px;
  background: #e3e7f1;
  border: none;
  cursor: pointer;
  transition: background 160ms ease;
  flex: none;
}

.switch::after {
  content: '';
  position: absolute;
  left: 2px;
  top: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.18);
  transition: transform 160ms ease;
}

.switch.on {
  background: var(--primary);
}

.switch.on::after {
  transform: translateX(18px);
}

.weekly {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 11px;
  border-radius: 10px;
  background: linear-gradient(120deg, rgba(255, 138, 61, 0.1), rgba(76, 141, 255, 0.08));
  margin-top: 6px;
}

.items {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  border-radius: 11px;
  background: #fafbff;
  border: 1px solid transparent;
}

.item.on {
  border-color: var(--accent);
  background: #fff8f1;
}

.item__icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 0 1px #eef1f8;
  flex: none;
}

.item__icon svg {
  width: 30px;
  height: 30px;
}

.item__main {
  flex: 1;
  min-width: 0;
}

.item__name {
  font-size: 12px;
  font-weight: 700;
}

.item__meta {
  font-size: 10px;
  color: var(--muted);
}

.item__qty {
  font-size: 11px;
  font-weight: 800;
  color: var(--primary);
}

/* ---------------- form ---------------- */

.form-intro__title {
  font-size: 23px;
  font-weight: 800;
  letter-spacing: -0.4px;
}

.form-intro__sub {
  margin-top: 3px;
  font-size: 11px;
  color: var(--sub);
}

.field {
  margin-top: 10px;
  padding: 14px;
}

.field__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 8px;
}

.input,
.textarea {
  width: 100%;
  border: none;
  background: #f5f7fc;
  border-radius: 9px;
  padding: 10px 11px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  outline: none;
}

.input::placeholder,
.textarea::placeholder {
  color: #b0adc2;
}

.textarea {
  min-height: 84px;
  resize: none;
  line-height: 1.65;
}

.presets {
  margin-top: 7px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.preset {
  font-size: 11px;
  color: var(--primary);
  background: rgba(76, 141, 255, 0.08);
  border: none;
  border-radius: 999px;
  padding: 4px 9px;
  cursor: pointer;
}

.group-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 9px;
  border-radius: 9px;
  background: #f7f9ff;
  cursor: pointer;
  margin-top: 5px;
}

.checkbox {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 1px solid #d7dcec;
  background: #fff;
  color: #fff;
  font-size: 13px;
  line-height: 20px;
  text-align: center;
  flex: none;
}

.checkbox.on {
  background: var(--primary-2);
  border-color: var(--primary-2);
}

.warn {
  margin-top: 6px;
  padding: 7px 9px;
  border-radius: 7px;
  background: #fff3e0;
  color: #b25c0e;
  font-size: 11px;
  line-height: 1.6;
}

.form-footer {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10px 14px 16px;
  background: linear-gradient(180deg, rgba(242, 246, 255, 0), #f2f6ff 38%);
  z-index: 20;
}

/* ---------------- inbox ---------------- */

.event {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 13px;
  cursor: pointer;
}

.event.read {
  opacity: 0.72;
}

.event__emoji {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: #f3f6ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex: none;
}

.event__text {
  font-size: 13px;
  line-height: 1.5;
  color: #3b3554;
}

.event__actor {
  font-weight: 800;
  color: var(--ink);
}

.event__time {
  font-size: 10px;
  color: var(--muted);
}

.event__dot {
  position: absolute;
  right: 9px;
  top: 9px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ff6b6b;
}

/* ---------------- sheet / toast ---------------- */

.sheet-mask {
  position: absolute;
  inset: 0;
  background: rgba(20, 16, 40, 0.38);
  z-index: 40;
  display: none;
}

.sheet-mask.on {
  display: block;
}

.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 41;
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 8px 14px 16px;
  transform: translateY(110%);
  transition: transform 260ms cubic-bezier(0.32, 0.72, 0.22, 1);
  max-height: 66%;
  display: flex;
  flex-direction: column;
}

.sheet.on {
  transform: translateY(0);
}

.sheet__handle {
  width: 36px;
  height: 4px;
  border-radius: 999px;
  background: #e6eaf5;
  margin: 2px auto 8px;
}

.sheet__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 8px;
}

.sheet__body {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sheet__foot {
  padding-top: 8px;
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 120px;
  transform: translateX(-50%) translateY(10px);
  background: rgba(20, 16, 40, 0.9);
  color: #fff;
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 10px;
  opacity: 0;
  pointer-events: none;
  transition: all 200ms ease;
  z-index: 60;
  max-width: 80%;
  text-align: center;
}

.toast.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---------------- animations ---------------- */

@keyframes rig-spin {
  0% {
    transform: rotate(0deg) scale(1);
  }
  55% {
    transform: rotate(200deg) scale(0.94);
  }
  100% {
    transform: rotate(360deg) scale(1);
  }
}

@keyframes rig-hug {
  0%,
  100% {
    transform: translateX(0) rotate(0deg);
  }
  30% {
    transform: translateX(-4px) rotate(-3deg) scale(1.02);
  }
  60% {
    transform: translateX(4px) rotate(3deg) scale(1.02);
  }
}

@keyframes rig-cheer {
  0%,
  100% {
    transform: translateY(0) scale(1);
  }
  30% {
    transform: translateY(-8px) scale(1.03);
  }
  55% {
    transform: translateY(0) scale(0.99);
  }
  75% {
    transform: translateY(-4px) scale(1.02);
  }
}

@keyframes rig-gift {
  0% {
    transform: scale(1);
  }
  35% {
    transform: scale(0.94) translateY(5px);
  }
  65% {
    transform: scale(1.06) translateY(-4px);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes me-in {
  0% {
    opacity: 0;
    transform: translateX(-70px) scale(0.92);
  }
  30% {
    opacity: 1;
    transform: translateX(30px) scale(1);
  }
  70% {
    opacity: 1;
    transform: translateX(23px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateX(-60px) scale(0.96);
  }
}

@keyframes author-shift {
  0% {
    transform: translateX(-50%);
  }
  40% {
    transform: translateX(-38%);
  }
  70% {
    transform: translateX(-38%);
  }
  100% {
    transform: translateX(-50%);
  }
}

@keyframes fx-float {
  0% {
    opacity: 0;
    transform: translate(-50%, 15px) scale(0.6);
  }
  25% {
    opacity: 1;
    transform: translate(-50%, -5px) scale(1.05);
  }
  75% {
    opacity: 1;
    transform: translate(-50%, -35px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -55px) scale(0.96);
  }
}
</style>

ne\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n        \u003c/svg>","active":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"81\" height=\"81\" viewBox=\"0 0 81 81\" shape-rendering=\"geometricPrecision\">\n          \u003ccircle cx=\"40.5\" cy=\"30\" r=\"14\" stroke=\"#2F6FE0\" stroke-width=\"4.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"#2F6FE0\" fill-opacity=\"0.12\"/>\n          \u003cpath d=\"M16,68 C18,55 28,48 40.5,48 C53,48 63,55 65,68\" stroke=\"#2F6FE0\" stroke-width=\"4.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"#2F6FE0\" fill-opacity=\"0.12\"/>\n          \u003cpath d=\"M35,30 Q40.5,34 46,30\" stroke=\"#2F6FE0\" stroke-width=\"3.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n        \u003c/svg>"},"inbox":{"normal":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"81\" height=\"81\" viewBox=\"0 0 81 81\" shape-rendering=\"geometricPrecision\">\n          \u003cpath d=\"M40.5,14 C41,22 48,24 54,28 C60,32 62,39 58,46 L54,52 L27,52 L23,46 C19,39 21,32 27,28 C33,24 40,22 40.5,14 Z\" stroke=\"#98A2B8\" stroke-width=\"4.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"#98A2B8\" fill-opacity=\"0.12\"/>\n          \u003cpath d=\"M40.5,52 L40.5,58 M30,58 Q40.5,68 51,58\" stroke=\"#98A2B8\" stroke-width=\"4.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n          \u003cpath d=\"M27,40 L54,40\" stroke=\"#98A2B8\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0.5\"/>\n        \u003c/svg>","active":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"81\" height=\"81\" viewBox=\"0 0 81 81\" shape-rendering=\"geometricPrecision\">\n          \u003cpath d=\"M40.5,14 C41,22 48,24 54,28 C60,32 62,39 58,46 L54,52 L27,52 L23,46 C19,39 21,32 27,28 C33,24 40,22 40.5,14 Z\" stroke=\"#2F6FE0\" stroke-width=\"4.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"#2F6FE0\" fill-opacity=\"0.12\"/>\n          \u003cpath d=\"M40.5,52 L40.5,58 M30,58 Q40.5,68 51,58\" stroke=\"#2F6FE0\" stroke-width=\"4.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n          \u003cpath d=\"M27,40 L54,40\" stroke=\"#2F6FE0\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0.5\"/>\n        \u003c/svg>"}}};</script>
  <script>/* 摔友记 V0 · 开发预览（浏览器内交互，非小程序运行时） */
(function () {
  const P = window.__PREVIEW__;
  const RIG = P.rig;
  const ART = P.art;
  const DATA = P.data;
  const TABBAR = P.tabbar;
  const esc = (value) =>
    String(value == null ? '' : value).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const S = {
    screen: 'atlas',
    groupId: (DATA.groups[0] || {}).id || '',
    view: 'front',
    me: JSON.parse(JSON.stringify(DATA.me.avatar)),
    prefs: Object.assign({}, DATA.me.preferences),
    inventory: DATA.inventory.map((item) => Object.assign({}, item)),
    weeklyClaimed: DATA.weekly.claimed,
    unread: DATA.inbox.unreadCount,
    inbox: DATA.inbox.events.map((event) => Object.assign({}, event)),
    publishedDetails: {},
    published: [],
    sheetOpen: false,
    storyId: Object.keys(DATA.details)[0] || null,
    form: {
      sport: 'ski_double',
      scenario: [],
      cause: [],
      bodyParts: [],
      impactKind: 'near_miss',
      protectiveItems: [],
      tone: 'humorous',
      title: '',
      body: '',
      groups: [(DATA.groups[0] || {}).id].filter(Boolean),
      anonymous: false,
      funny: true,
      gifts: true,
    },
  };

  const toastEl = document.getElementById('toast');
  let toastTimer = 0;
  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1900);
  }

  function detailOf(storyId) {
    return S.publishedDetails[storyId] || DATA.details[storyId] || null;
  }

  function groupOf(groupId) {
    return DATA.groups.find((group) => group.id === groupId) || DATA.groups[0];
  }

  function atlasFor(groupId, view) {
    const base = DATA.atlases[groupId] && DATA.atlases[groupId][view];
    if (!base) return null;
    const clone = JSON.parse(JSON.stringify(base));
    const extras = S.published.filter((item) => item.groupIds.includes(groupId) && item.detail);
    if (!extras.length) return clone;
    for (const item of extras) {
      const card = item.card;
      clone.stories.push(card);
      clone.storyCount += 1;
      if (!clone.stories.some((story, index) => index < clone.stories.length - 1 && story.authorId === card.authorId)) {
        clone.participantCount += 1;
      }
      for (const part of card.bodyParts) {
        const spot = clone.hotspots.find((s) => s.id === part);
        if (!spot) continue;
        spot.count += 1;
        spot.storyIds.push(card.id);
        if (!spot.users.some((user) => user.userId === card.authorId)) {
          spot.users.push({
            userId: card.authorId,
            displayName: card.authorName,
            palette: card.palette,
            expression: card.expression,
            equipped: card.equipped,
            isAnonymous: card.isAnonymous,
          });
        }
      }
    }
    clone.stories.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    const counts = new Map();
    for (const story of clone.stories) {
      for (const part of story.bodyParts) {
        if (part === 'other') continue;
        counts.set(part, (counts.get(part) || 0) + 1);
      }
    }
    const max = Math.max(1, ...counts.values());
    clone.hottest = [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3)
      .map(([bodyPart, count]) => ({
        bodyPart,
        label: DATA.labels.bodyPart[bodyPart] || bodyPart,
        count,
        pct: Math.round((count / max) * 100),
      }));
    return clone;
  }

  function layered(avatar, view, mode) {
    const defs = (RIG.views[view] || RIG.views.front) || [];
    const active = [];
    for (const layer of defs) {
      let src = null;
      if (layer.slot === 'expression') src = layer.variants[avatar.expression] || layer.variants.happy;
      else if (layer.slot) {
        const value = avatar.equipped[layer.slot];
        if (!value) continue;
        src = layer.variants[value];
      } else {
        src = layer.src;
      }
      if (!src) continue;
      if (mode === 'chip' && ['head', 'headgear', 'goggles'].indexOf(layer.id) < 0) continue;
      active.push({ layer, src });
    }
    if (!active.length) return [];
    const boxes = active.map((item) => item.layer.bbox);
    let box = { x: 0, y: 0, w: RIG.canvas.width, h: RIG.canvas.height };
    if (mode === 'chip') {
      const raw = {
        x: Math.min(...boxes.map((b) => b.x)),
        y: Math.min(...boxes.map((b) => b.y)),
        w: Math.max(...boxes.map((b) => b.x + b.w)) - Math.min(...boxes.map((b) => b.x)),
        h: Math.max(...boxes.map((b) => b.y + b.h)) - Math.min(...boxes.map((b) => b.y)),
      };
      const side = Math.max(raw.w, raw.h);
      box = { x: raw.x - (side - raw.w) / 2, y: raw.y - (side - raw.h) / 2, w: side, h: side };
    }
    return active.map(({ layer, src }) => ({
      src,
      z: layer.z,
      left: ((layer.bbox.x - box.x) / box.w) * 100,
      top: ((layer.bbox.y - box.y) / box.h) * 100,
      width: (layer.bbox.w / box.w) * 100,
      height: (layer.bbox.h / box.h) * 100,
    }));
  }

  function rigHtml(avatar, view, mode, className) {
    const layers = layered(avatar, view || 'front', mode || 'full');
    const inner = layers
      .map(
        (layer) =>
          `<div class="rig-layer" style="left:${layer.left.toFixed(2)}%;top:${layer.top.toFixed(
            2,
          )}%;width:${layer.width.toFixed(2)}%;height:${layer.height.toFixed(2)}%;z-index:${layer.z}">${
            ART[layer.src] || ''
          }</div>`,
      )
      .join('');
    return `<div class="rig ${className || ''}">${inner}</div>`;
  }

  function chipHtml(chip, size) {
    const avatar = {
      palette: chip.palette,
      expression: chip.expression,
      equipped: chip.equipped,
    };
    return `<div class="avatar-chip" style="${size ? `width:${size}px;height:${size}px;` : ''}">${rigHtml(
      avatar,
      'front',
      'chip',
    )}</div>`;
  }

  function timeText(iso) {
    const now = Date.now();
    const ts = Date.parse(iso);
    const diff = now - ts;
    if (diff < 3600 * 1000) return Math.max(1, Math.round(diff / 60000)) + ' 分钟前';
    if (diff < 24 * 3600 * 1000) return Math.round(diff / 3600000) + ' 小时前';
    if (diff < 7 * 24 * 3600 * 1000) return Math.round(diff / 86400000) + ' 天前';
    const d = new Date(ts);
    return `${d.getMonth() + 1}-${d.getDate()}`;
  }

  function impactLabel(detail) {
    return DATA.labels.impact[detail.incident.impactKind] || '';
  }

  function storyCardHtml(card) {
    return `<div class="story-card" onclick="P.openStory('${card.id}')">
      <div class="story-card__head">
        <div class="story-card__avatar">${chipHtml(card)}</div>
        <div style="flex:1;min-width:0">
          <div class="story-card__name">${esc(card.authorName)}${
            card.isAnonymous ? '<span class="story-card__badge">匿名</span>' : ''
          }</div>
          <div class="story-card__meta">${timeText(card.createdAt)} · ${DATA.labels.sportEmoji[card.sport] || ''} ${
            DATA.labels.sport[card.sport] || ''
          }</div>
        </div>
      </div>
      <div class="story-card__title">${esc(card.title)}</div>
      <div class="story-card__tags">
        <span class="tag tag--blue">${DATA.labels.impact[card.impactKind] || ''}</span>
        ${card.bodyParts
          .filter((part) => part !== 'other')
          .map((part) => `<span class="tag">${DATA.labels.bodyPart[part] || part}</span>`)
          .join('')}
      </div>
    </div>`;
  }

  /* ------------------------------------------------------------------ atlas */

  function renderAtlas() {
    const group = groupOf(S.groupId);
    const atlas = atlasFor(S.groupId, S.view);
    if (!atlas) return '<div class="scroll"><div class="card" style="padding:40px">没有图鉴数据</div></div>';
    const hotspots = atlas.hotspots
      .map((spot) => {
        const def = (RIG.hotspots[S.view] || []).find((item) => item.id === spot.id);
        if (!def) return '';
        const chips = spot.users.slice(0, 2).map((user) => chipHtml(user)).join('');
        const more = spot.users.length > 2 ? `<div class="avatar-chip more">+${spot.users.length - 2}</div>` : '';
        return `<div class="hotspot" style="left:${(def.x / RIG.canvas.width) * 100}%;top:${
          (def.y / RIG.canvas.height) * 100
        }%" onclick="P.openHotspot('${spot.id}')" title="${esc(spot.label)}">
          ${spot.count ? `<div class="stack">${chips}${more}</div>` : '<div class="dot"></div>'}
        </div>`;
      })
      .join('');
    const bars = atlas.hottest
      .map((item) => `<span class="hotpill">${esc(item.label)} ${item.count}</span>`)
      .join('');
    const stories = atlas.stories.map((card) => storyCardHtml(card)).join('');
    return `<div class="scroll" id="atlas-scroll">
      <div class="hero">
        <div class="hero__top">
          <div style="min-width:0">
            <div class="hero__name" onclick="P.switchGroup()">${esc(group.name)} ▾</div>
            <div class="hero__meta">${group.memberCount} 位雪友 · ${
              group.role === 'owner' ? '圈主' : group.role === 'admin' ? '管理员' : '成员'
            }</div>
          </div>
          <div class="hero__actions">
            <button class="icon-btn" onclick="P.go('group')" title="圈子">圈</button>
            <button class="icon-btn" onclick="P.go('settings')" title="设置">⚙</button>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat__num">${atlas.storyCount}</div><div class="stat__label">故事总数</div></div>

    </div>

  /* ------------------------------------------------------------------ story */

  function renderStory() {
    const detail = detailOf(S.storyId);
    if (!detail) return '<div class="scroll"><div class="card" style="padding:40px">故事不存在</div></div>';
    const avatar = detail.avatar;
    const story = detail.story;
    const incident = detail.incident;
    const group = detail.group || groupOf(S.groupId);
    const tags = [
      `<span class="tag tag--blue">${DATA.labels.sport[incident.sport] || ''}</span>`,
      `<span class="tag">${DATA.labels.impact[incident.impactKind] || ''}</span>`,
      ...incident.scenario.map((id) => `<span class="tag">${DATA.labels.scenario[id] || id}</span>`),
      ...incident.selfReportedCause.map((id) => `<span class="tag tag--warm">自述：${DATA.labels.cause[id] || id}</span>`),
      ...incident.protectiveItems.map((id) => `<span class="tag tag--mint">${DATA.labels.protective[id] || id}</span>`),
    ].join('');
    const updates = (detail.updates || [])
      .map(
        (update) => `<div class="update">
          <div class="update__rail"><div class="update__dot"></div></div>
          <div style="flex:1">
            <div class="between"><div class="update__type">${DATA.labels.update[update.type] || '后续'}</div><div class="update__time">${timeText(
              update.createdAt,
            )}</div></div>
            <div class="update__text">${esc(update.body)}</div>
          </div>
        </div>`,
      )
      .join('');
    const reactionButtons = DATA.actions
      .filter((action) => action.id !== 'receive_gift')
      .map((action) => {
        const mine = (detail.myReactions || []).find((item) => item.actionId === action.id) || { mine: 0 };
        const total = (detail.reactions || []).find((item) => item.actionId === action.id) || { count: 0 };
        const blocked = action.requiresFunnyConsent && !detail.canSpin;
        const used = mine.mine >= action.maxPerActorPerStoryPerDay;
        return `<button class="reaction" ${blocked || used ? 'disabled' : ''} onclick="P.react('${action.id}')">
          <span class="reaction__emoji">${action.fallbackEmoji}</span>${action.name}
          ${total.count ? `<span class="reaction__count">${total.count}</span>` : ''}
        </button>`;
      })
      .join('');
    return `<div class="scroll" id="story-scroll">
      <div class="between">
        <div class="author">
          <div class="author__avatar">${chipHtml(avatar)}</div>
          <div>
            <div class="author__name">${esc(detail.author.displayName)}${
              story.isAnonymous ? '<span class="story-card__badge">匿名展示</span>' : ''
            }</div>
            <div class="author__meta">${esc(group.name)} · ${timeText(story.createdAt)} · ${
              DATA.labels.sportEmoji[incident.sport] || ''
            } ${DATA.labels.sport[incident.sport] || ''}</div>
          </div>
        </div>
        <button class="icon-btn" onclick="P.toast('分享卡片会带 storyId，但不授予查看权限')">↗</button>
      </div>

      <div class="story-stage" id="story-stage">
        <div class="story-stage__badge">${DATA.labels.sportEmoji[incident.sport] || ''} ${
          DATA.labels.sport[incident.sport] || ''
        }</div>
        <div class="story-stage__impact">${DATA.labels.impact[incident.impactKind] || ''}</div>
        <div class="story-stage__rig">${rigHtml(avatar, 'front', 'full', 'story-rig')}</div>
        <div class="story-stage__me">${rigHtml(S.me, 'front', 'full')}</div>
      </div>

      <div class="card story-body">
        <div class="story-body__title">${esc(story.title)}</div>
        <div class="story-body__text">${esc(story.body)}</div>
        <div class="chips" style="margin-top:10px">${tags}</div>
        <div class="story-body__note">「原因」是本人自述，不是责任认定，也不构成医疗或理赔判断。</div>
      </div>

      ${updates ? `<div class="card timeline"><div class="section-title">后续</div>${updates}</div>` : ''}

      <div class="card reactions">
        <div class="reactions__grid">${reactionButtons}
          <button class="reaction reaction--gift" onclick="P.openGift()">
            <span class="reaction__emoji">🎁</span>送装备
          </button>
        </div>
        <div class="reactions__note">每人每天对同一条故事最多互动 3 次；装备免费、无现金价值。作者关闭搞笑动作后，「转圈」会自动禁用。</div>
      </div>

      <div class="links">
        <div class="link" onclick="P.toast('V0 本地原型没有平台审核后台，举报不会真的提交')">举报这条内容</div>
        ${
          detail.author.isMe
            ? `<div class="link" onclick="P.toast('撤回后统计会同步更新（演示）')">撤回我的故事</div>`
            : ''
        }
      </div>
    </div>`;
  }

    const inventory = S.inventory

        (item) => `<div class="item">

          <div class="item__main"><div class="item__name">${esc(item.name)}</div><div class="item__meta">${item.expiresText}</div></div>

    return `<div class="scroll">

      <div class="card panel">

        <div class="expressions">${expressions}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">配色</div><div class="tiny">小头像的底色标签</div></div>
        <div class="palettes">${palettes}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">雪服</div><div class="tiny">已拥有</div></div>
        <div class="gear-list">${outfits}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">头部与护具</div><div class="tiny">原创通用造型</div></div>
        <div class="chips">
          <button class="chip ${!avatar.equipped.headgear ? 'on' : ''}" onclick="P.equip('headgear',null)">不戴</button>
          ${headgears}
        </div>
        <div class="toggle-row">
          <div><div class="toggle-row__name">雪镜</div><div class="tiny">半透明镜片，不挡表情</div></div>
          <button class="switch ${avatar.equipped.goggles ? 'on' : ''}" onclick="P.toggleGear('goggles','snow_goggles')"></button>
        </div>
        <div class="toggle-row">
          <div><div class="toggle-row__name">护臀</div><div class="tiny">尾椎的忠实伙伴</div></div>
          <button class="switch ${avatar.equipped.hip_protector ? 'on' : ''}" onclick="P.toggleGear('hip_protector','basic_hip_protector')"></button>
        </div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">背包</div><div class="tiny">${
          S.weeklyClaimed ? '本周补给已领取' : '本周补给待领取'
        }</div></div>
        <div class="weekly">
          <div><div style="font-size:13px;font-weight:700">每周免费补给</div><div class="tiny">2 件随机互动道具 · 不需要分享</div></div>
          <button class="btn ${S.weeklyClaimed ? 'btn--ghost' : 'btn--primary'}" onclick="P.claimWeekly()">${
            S.weeklyClaimed ? '已领取' : '领取'

        <div class="items">${inventory}</div>

      <div class="footnote">角色资产为原创几何造型；不包含任何品牌 Logo 或官方联名暗示。</div>
    </div>`;
  }

  /* ------------------------------------------------------------------- form */

  const PRESETS = {
    tailbone: ['尾椎渡劫记', '雪地坐姿标准动作', '我的屁股先下班了'],
    head: ['差一点就飞升', '头盔替我挡了一劫'],
    back: ['后背和雪地的第一次接触'],
    waist: ['腰：我只是路过'],
    wrist_l: ['手腕说它今天不想上班'],
    wrist_r: ['手腕说它今天不想上班'],
    knee_l: ['膝盖的今日复盘'],
    knee_r: ['膝盖的今日复盘'],
    ankle_l: ['脚踝的意外假期'],
    ankle_r: ['脚踝的意外假期'],
    shoulder_l: ['肩膀说它有点懵'],
    shoulder_r: ['肩膀说它有点懵'],
  };
  const FALLBACK_PRESETS = ['今天在雪里打了个滚', '一次不太优雅的落地', '平安回家的乌龙'];

  function presets() {
    const first = S.form.bodyParts[0];
    return (first && PRESETS[first]) || FALLBACK_PRESETS;
  }

  function presetButtons() {
    return presets()
      .map((title) => `<button class="preset" onclick="P.usePreset('${esc(title)}')">${esc(title)}</button>`)
      .join('');
  }

  function refreshPresets() {
    const box = document.getElementById('preset-box');
    if (box) box.innerHTML = presetButtons();
  }

  function renderCreate() {
    const F = S.form;
    const chip = (kind, id, label, selected) =>
      `<button class="chip ${selected ? 'on' : ''}" data-chip-kind="${kind}" onclick="P.toggleForm('${kind}','${id}',this)">${label}</button>`;
    const sports = DATA.labels.sports
      .map((item) => chip('sport', item.id, `${item.emoji} ${item.label}`, F.sport === item.id))
      .join('');
    const scenarios = DATA.labels.scenarios
      .map((item) => chip('scenario', item.id, item.label, F.scenario.includes(item.id)))
      .join('');
    const causes = DATA.labels.causes.map((item) => chip('cause', item.id, item.label, F.cause.includes(item.id))).join('');
    const parts = DATA.labels.bodyParts
      .map((item) => chip('bodyParts', item.id, item.label, F.bodyParts.includes(item.id)))
      .join('');
    const impacts = DATA.labels.impacts
      .map((item) => chip('impactKind', item.id, item.label, F.impactKind === item.id))
      .join('');
    const protections = DATA.labels.protectives
      .map((item) => chip('protectiveItems', item.id, item.label, F.protectiveItems.includes(item.id)))
      .join('');
    const groups = DATA.groups
      .map(
        (group) => `<div class="group-row" onclick="P.toggleGroup('${group.id}')">
          <div class="checkbox ${F.groups.includes(group.id) ? 'on' : ''}">✓</div>
          <div style="flex:1"><div style="font-size:13px;font-weight:700">${esc(group.name)}</div><div class="tiny">${
            group.memberCount
          } 位雪友</div></div>
        </div>`,
      )
      .join('');
    return `<div class="scroll" style="padding-bottom:110px">
      <div class="form-intro"><div class="form-intro__title">记录一次经历</div><div class="form-intro__sub">标签 + 一句话，30 秒就能发；不用 AI 也完整可用。</div></div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">运动</div><div class="tiny">单选</div></div>
        <div class="chips">${sports}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">发生背景</div><div class="tiny">最多 3 个</div></div>
        <div class="chips">${scenarios}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">自述原因</div><div class="tiny">最多 3 个 · 不是责任认定</div></div>
        <div class="chips">${causes}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">身体部位</div><div class="tiny">最多 3 个 · 用于热区统计</div></div>
        <div class="chips">${parts}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">当时情况</div><div class="tiny">不构成伤情分级</div></div>
        <div class="chips">${impacts}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">当时戴了</div><div class="tiny">可多选</div></div>
        <div class="chips">${protections}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">标题</div><div class="tiny" id="title-count">${F.title.length}/24</div></div>
        <input class="input" maxlength="24" placeholder="比如：尾椎渡劫记" value="${esc(F.title)}" oninput="P.inputTitle(this.value)" />
        <div class="tiny" style="margin-top:7px">点一下直接套用</div>
        <div class="presets" id="preset-box">${presetButtons()}</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">一句话经过</div><div class="tiny" id="body-count">${F.body.length}/140</div></div>
        <textarea class="textarea" maxlength="140" placeholder="发生了什么？比如：转弯时卡刃，坐了个屁股墩，护臀救了我。" oninput="P.inputBody(this.value)">${esc(
          F.body,
        )}</textarea>
        <div class="tiny" style="margin-top:6px">请去掉姓名、电话、证件号、详细住址等可识别信息。</div>
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">可见圈子</div><div class="tiny">逐个勾选，不会自动跨群</div></div>
        ${groups}
      </div>

      <div class="card panel">
        <div class="panel__head"><div class="section-title">互动设置</div><div class="tiny">随时可改</div></div>
        <div class="toggle-row">
          <div><div class="toggle-row__name">匿名展示</div><div class="tiny">只隐藏昵称</div></div>
          <button class="switch ${F.anonymous ? 'on' : ''}" onclick="P.toggleField('anonymous')"></button>
        </div>
        <div class="toggle-row">
          <div><div class="toggle-row__name">允许搞笑动作</div><div class="tiny">关闭后不能「转圈」</div></div>
          <button class="switch ${F.funny ? 'on' : ''}" onclick="P.toggleField('funny')"></button>
        </div>
        <div class="toggle-row">
          <div><div class="toggle-row__name">允许收礼物</div><div class="tiny">免费互动道具</div></div>
          <button class="switch ${F.gifts ? 'on' : ''}" onclick="P.toggleField('gifts')"></button>
        </div>
      </div>

      <div class="footnote">发布即表示这是你本人的经历与描述。摔友记不提供诊断、治疗、康复或理赔结论。</div>
    </div>
    <div class="form-footer"><button class="btn btn--primary btn--block" onclick="P.publish()">发布到圈子</button></div>`;
  }

        (member) => `<div class="item" style="background:transparent;padding:6px 4px">

          }</div><div class="item__meta">${member.storyCount} 条故事</div></div>

          group.joinMode === 'open' ? '自由加入' : '需要圈主确认'
        }</div>
        <div class="stats"><div class="mini stat"><div class="stat__num">${(DATA.members[group.id] || []).length}</div><div class="stat__label">成员</div></div><div class="mini stat"><div class="stat__num">${
          (DATA.members[group.id] || []).length
        }</div><div class="stat__label">故事</div></div></div>
      </div>
      <div class="card panel">
        <div class="panel__head"><div class="section-title">圈子成员</div><div class="tiny">按加入顺序</div></div>
        ${members}

  }

  /* ------------------------------------------------------------------- inbox */

  function renderInbox() {
    const events = S.inbox
      .map(
        (event, index) => `<div class="card event ${event.read ? 'read' : ''}" onclick="P.openEvent(${index})">
          <div class="event__emoji">${actionEmoji(event.actionId)}</div>
          <div style="flex:1;min-width:0">
            <div class="event__text"><span class="event__actor">${esc(event.actorName)}</span>${eventText(event)}</div>
            <div class="event__time">${timeText(event.createdAt)} · 点一下回放动画</div>
          </div>
          ${!event.read ? '<div class="event__dot"></div>' : ''}
        </div>`,
      )
      .join('');
    return `<div class="scroll">
      <div class="between" style="padding:4px 2px 0">
        <div><div style="font-size:23px;font-weight:800">消息</div><div class="tiny">谁对你的故事抱了抱、转了圈、送了装备</div></div>
        ${
          S.unread
            ? `<button class="btn btn--ghost" style="height:28px;font-size:11px" onclick="P.markAllRead()">全部已读</button>`
            : ''
        }
      </div>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:7px">${
        events || '<div class="card panel tiny">还没有互动</div>'
      }</div>
      <div class="footnote">互动只是展示层效果，不会改变对方的角色配置；收到的装备需要本人确认才会穿上。</div>
    </div>`;
  }

  function actionEmoji(actionId) {
    const action = DATA.actions.find((item) => item.id === actionId);
    return action ? action.fallbackEmoji : '💬';
  }

  function eventText(event) {
    if (event.actionId === 'receive_gift') {
      const item = DATA.items.find((entry) => entry.id === event.itemDefId);
      return ` 送你一件「${item ? item.name : '装备'}」`;
    }
    const action = DATA.actions.find((entry) => entry.id === event.actionId);
    return ` ${action ? action.name : '互动'}了你的故事`;
  }

  /* ------------------------------------------------------------------- shell */

  const TITLES = { atlas: '摔友记', story: '故事', avatar: '我的角色', create: '记录一次经历', inbox: '消息', group: '圈子', settings: '设置' };
  const TAB_SCREENS = ['atlas', 'avatar', 'inbox'];

  function render() {
    const app = document.getElementById('app');
    const nav = TITLES[S.screen] || '';
    const back = TAB_SCREENS.indexOf(S.screen) < 0;
    let body = '';
    if (S.screen === 'atlas') body = renderAtlas();
    else if (S.screen === 'story') body = renderStory();
    else if (S.screen === 'avatar') body = renderAvatar();
    else if (S.screen === 'create') body = renderCreate();
    else if (S.screen === 'group') body = renderGroup();
    else if (S.screen === 'inbox') body = renderInbox();
    else body = '<div class="scroll"><div class="card panel">设置页在小程序里，预览暂略。</div></div>';
    app.innerHTML = `<div class="navbar">${back ? `<button class="navbar__back" onclick="P.back()">‹</button>` : ''}${nav}</div>${body}`;
    document.getElementById('tabbar').classList.toggle('hidden', !TAB_SCREENS.includes(S.screen));
    document.querySelectorAll('.tabbar button').forEach((button) => {
      button.classList.toggle('on', button.dataset.screen === S.screen);
    });
    document.querySelectorAll('.toolbar button[data-screen]').forEach((button) => {
      button.classList.toggle('on', button.dataset.screen === S.screen);
    });
  }

  function go(screen) {
    S.screen = screen;
    closeSheet();
    render();
  }

  function back() {
    go('atlas');
  }

  function openSheet(title, content, foot) {
    const mask = document.querySelector('.sheet-mask');
    const sheet = document.querySelector('.sheet');
    sheet.innerHTML = `<div class="sheet__handle"></div><div class="sheet__head"><div class="section-title">${esc(
      title,
    )}</div><div class="tiny">${''}</div></div><div class="sheet__body">${content}</div>${
      foot ? `<div class="sheet__foot">${foot}</div>` : ''
    }`;
    mask.classList.add('on');
    sheet.classList.add('on');
    S.sheetOpen = true;
  }

  function closeSheet() {
    document.querySelector('.sheet-mask').classList.remove('on');
    document.querySelector('.sheet').classList.remove('on');
    S.sheetOpen = false;
  }

  /* ------------------------------------------------------------------ actions */

  const api = {
    go,
    back,
    toast,
    switchGroup() {
      const index = DATA.groups.findIndex((group) => group.id === S.groupId);
      const next = DATA.groups[(index + 1) % DATA.groups.length];
      S.groupId = next.id;
      S.view = 'front';
      render();
    },
    setView(view) {
      S.view = view;
      render();
    },
    openHotspot(id) {
      const atlas = atlasFor(S.groupId, S.view);
      const spot = atlas.hotspots.find((item) => item.id === id);
      const stories = atlas.stories.filter((story) => story.bodyParts.includes(id));
      if (!spot || !stories.length) {
        toast(`${spot ? spot.label : '这个部位'}还没有故事`);
        return;
      }
      openSheet(
        `${spot.label}的故事`,
        stories.map((card) => storyCardHtml(card)).join(''),
      );
    },
    openStory(storyId) {
      S.storyId = storyId;
      closeSheet();
      go('story');
    },
    openEvent(index) {
      const event = S.inbox[index];
      if (!event) return;
      event.read = true;
      S.unread = Math.max(0, S.unread - 1);
      S.storyId = event.storyId;
      go('story');
      if (event.actionId && event.actionId !== 'receive_gift') setTimeout(() => animateStory(event.actionId), 320);
    },
    markAllRead() {
      S.inbox.forEach((event) => (event.read = true));
      S.unread = 0;
      render();
      toast('都看完啦');
    },
    react(actionId) {
      const detail = detailOf(S.storyId);
      if (!detail) return;
      const action = DATA.actions.find((item) => item.id === actionId);
      if (!action) return;
      if (action.requiresFunnyConsent && !detail.canSpin) return toast('作者关闭了这个搞笑动作');
      const mine = (detail.myReactions || []).find((item) => item.actionId === actionId);
      if (!mine) return;
      if (mine.mine >= action.maxPerActorPerStoryPerDay) return toast('今天对这条故事的互动次数用完了');
      mine.mine += 1;
      const total = (detail.reactions || []).find((item) => item.actionId === actionId);
      if (total) total.count += 1;
      render();
      setTimeout(() => animateStory(actionId), 20);
    },
    openGift() {
      const detail = detailOf(S.storyId);
      if (!detail) return;
      if (!detail.giftable) return toast('作者暂时不收礼物');
      const items = S.inventory.filter((item) => item.category === 'consumable' && item.quantity > 0);
      if (!items.length) return toast('背包里还没有可以送出的道具');
      if (!S.selectedGift || !items.some((item) => item.itemDefId === S.selectedGift)) {
        S.selectedGift = items[0].itemDefId;
      }
      openSheet(
        '送一件装备',
        items
          .map(
            (item) => `<div class="item ${S.selectedGift === item.itemDefId ? 'on' : ''}" onclick="P.selectGift('${
              item.itemDefId
            }')">
              <div class="item__icon">${ART.items[item.itemDefId] || ''}</div>
              <div class="item__main"><div class="item__name">${esc(item.name)}</div><div class="item__meta">${item.expiresText}</div></div>
              <div class="item__qty">×${item.quantity}</div>
            </div>`,
          )
          .join(''),
        `<button class="btn btn--primary btn--block" onclick="P.sendGift()">送出去</button>`,
      );
    },
    selectGift(itemDefId) {
      S.selectedGift = itemDefId;
      api.openGift();
    },
    sendGift() {
      const item = S.inventory.find((entry) => entry.itemDefId === S.selectedGift);
      if (!item || item.quantity <= 0) return toast('这件道具没有库存了');
      item.quantity -= 1;
      closeSheet();
      render();
      setTimeout(() => animateStory('receive_gift'), 20);
      toast('送到啦');
    },
    setExpression(expression) {
      S.me.expression = expression;
      render();
    },
    setPalette(palette) {
      S.me.palette = palette;
      render();
    },
    equip(slot, value) {
      S.me.equipped = Object.assign({}, S.me.equipped, { [slot]: value || null });
      render();
    },
    toggleGear(slot, value) {
      S.me.equipped = Object.assign({}, S.me.equipped, { [slot]: S.me.equipped[slot] ? null : value });
      render();
    },
    claimWeekly() {
      if (S.weeklyClaimed) return toast('本周补给已经领过啦');
      S.weeklyClaimed = true;
      const cocoa = S.inventory.find((item) => item.itemDefId === 'hot_cocoa');
      if (cocoa) cocoa.quantity += 1;
      const patch = S.inventory.find((item) => item.itemDefId === 'comfort_patch');
      if (patch) patch.quantity += 1;
      render();
      toast('本周补给已到账');
    },
    toggleForm(kind, id, element) {
      const F = S.form;
      if (kind === 'sport' || kind === 'impactKind') {
        if (kind === 'sport') F.sport = id;
        else F.impactKind = id;
        document.querySelectorAll(`.chip[data-chip-kind="${kind}"]`).forEach((node) => node.classList.remove('on'));
        element.classList.add('on');
        return;
      }
      const list = F[kind];
      const index = list.indexOf(id);
      if (index >= 0) list.splice(index, 1);
      else {
        if (list.length >= 3 && ['scenario', 'cause', 'bodyParts'].includes(kind)) return toast('最多选 3 个');
        list.push(id);
      }
      element.classList.toggle('on');
      if (kind === 'bodyParts') refreshPresets();
    },
    toggleGroup(groupId) {
      const list = S.form.groups;
      const index = list.indexOf(groupId);
      if (index >= 0) list.splice(index, 1);
      else list.push(groupId);
      const rows = document.querySelectorAll('.group-row');
      for (const row of rows) {
        if (row.getAttribute('onclick') && row.getAttribute('onclick').indexOf(`'${groupId}'`) >= 0) {
          const box = row.querySelector('.checkbox');
          if (box) box.classList.toggle('on', list.indexOf(groupId) >= 0);
        }
      }
    },
    toggleField(field) {
      S.form[field] = !S.form[field];
      const rows = document.querySelectorAll('.toggle-row .switch');
      // 三个开关按顺序：匿名 / 搞笑 / 礼物
      const order = ['anonymous', 'funny', 'gifts'];
      const index = order.indexOf(field);
      if (index >= 0 && rows[index]) rows[index].classList.toggle('on', S.form[field]);
    },
    inputTitle(value) {
      S.form.title = value;
      const count = document.getElementById('title-count');
      if (count) count.textContent = `${value.length}/24`;
    },
    inputBody(value) {
      S.form.body = value;
      const count = document.getElementById('body-count');
      if (count) count.textContent = `${value.length}/140`;
    },
    usePreset(title) {
      S.form.title = title;
      const input = document.querySelector('input.input');
      if (input) input.value = title;
      const count = document.getElementById('title-count');
      if (count) count.textContent = `${title.length}/24`;
    },
    publish() {
      const F = S.form;
      if (!F.title.trim()) return toast('先起个标题吧');
      if (!F.body.trim()) return toast('写一句当时的经过');
      if (!F.bodyParts.length) return toast('选一下身体部位');
      if (!F.scenario.length) return toast('选一下发生背景');
      if (!F.cause.length) return toast('选一下原因，或选「原因未知」');
      if (!F.groups.length) return toast('至少选择一个可见圈子');
      const storyId = `sty_preview_${Date.now()}`;
      const now = new Date().toISOString();
      const incident = {
        id: `inc_${storyId}`,
        sport: F.sport,
        scenario: F.scenario.slice(),
        selfReportedCause: F.cause.slice(),
        bodyParts: F.bodyParts.slice(),
        impactKind: F.impactKind,
        protectiveItems: F.protectiveItems.slice(),
        source: 'manual',
      };
      const story = {
        id: storyId,
        title: F.title.trim(),
        body: F.body.trim(),
        isAnonymous: F.anonymous,
        allowFunnyActions: F.funny,
        allowGifts: F.gifts,
        visibilityGroupIds: F.groups.slice(),
        createdAt: now,
      };
      const group = groupOf(F.groups[0]);
      const detail = {
        story,
        incident,
        author: { id: 'usr_me', displayName: '小北', palette: S.me.palette, isMe: true },
        avatar: JSON.parse(JSON.stringify(S.me)),
        updates: [],
        reactions: DATA.actions
          .filter((action) => action.id !== 'receive_gift')
          .map((action) => ({ actionId: action.id, count: 0, mine: 0 })),
        myReactions: DATA.actions
          .filter((action) => action.id !== 'receive_gift')
          .map((action) => ({ actionId: action.id, count: 0, mine: 0 })),
        giftable: F.gifts,
        canSpin: F.funny,
        group,
        canInteract: true,
      };
      const card = {
        id: storyId,
        title: story.title,
        authorId: 'usr_me',
        authorName: F.anonymous ? '匿名雪友' : '小北',
        isAnonymous: F.anonymous,
        sport: F.sport,
        bodyParts: F.bodyParts,
        impactKind: F.impactKind,
        tone: F.tone,
        allowFunnyActions: F.funny,
        allowGifts: F.gifts,
        publishStatus: 'published',
        createdAt: now,
        palette: S.me.palette,
        expression: S.me.expression,
        equipped: JSON.parse(JSON.stringify(S.me.equipped)),
      };
      S.publishedDetails[storyId] = detail;
      S.published.push({ groupIds: F.groups.slice(), detail, card });
      S.storyId = storyId;
      S.groupId = F.groups[0];
      S.screen = 'story';
      render();
      toast('发布成功');
    },
  };

  function animateStory(actionId) {
    const stage = document.getElementById('story-stage');
    if (!stage) return;
    const rig = stage.querySelector('.story-stage__rig .rig');
    if (!rig) return;
    const classes = { spin: 'rig--spin', hug: 'rig--hug', cheer: 'rig--cheer', receive_gift: 'rig--gift' };
    const emojis = { spin: '😵‍💫', hug: '💗', cheer: '🎉', receive_gift: '🎁' };
    rig.classList.add(classes[actionId] || '');
    if (actionId === 'hug') stage.classList.add('hug');
    const fx = document.createElement('div');
    fx.className = 'fx';
    fx.textContent = emojis[actionId] || '';
    stage.appendChild(fx);
    setTimeout(() => {
      rig.classList.remove(classes[actionId] || '');
      stage.classList.remove('hug');
      if (fx.parentNode) fx.parentNode.removeChild(fx);
    }, 1600);
  }

  window.P = api;
  window.PREVIEW_STATE = S;

  document.querySelectorAll('.toolbar button[data-screen]').forEach((button) => {
    button.addEventListener('click', () => go(button.dataset.screen));
  });
  document.querySelectorAll('.tabbar button').forEach((button) => {
    button.addEventListener('click', () => go(button.dataset.screen));
  });
  document.querySelector('.sheet-mask').addEventListener('click', closeSheet);

  // 初始化 tabbar 图标
  document.querySelectorAll('.tabbar button').forEach((button) => {
    const screen = button.dataset.screen;
    const icon = button.querySelector('.icon');
    if (icon && TABBAR && TABBAR[screen]) {
      icon.innerHTML = `<span class="normal">${TABBAR[screen].normal}</span><span class="active">${TABBAR[screen].active}</span>`;
    }
  });

  const params = new URLSearchParams(location.search);
  const initial = params.get('screen') || (location.hash || '').replace('#', '');
  if (TITLES[initial]) S.screen = initial;
  if (params.get('full')) document.body.classList.add('full-mode');

  render();

  const scrollTop = Number(params.get('scroll') || 0);
  if (scrollTop > 0) {
    const scroller = document.querySelector('.scroll');
    if (scroller) scroller.scrollTop = scrollTop;
  }
})();
</script>
</body>
</html>
